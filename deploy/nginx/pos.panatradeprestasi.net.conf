# TLS is terminated before this Nginx instance. If this server must terminate
# HTTPS itself, add a 443 server block using Certbot or your certificate files.

map $http_upgrade $pos_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $pos_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.panatradeprestasi.net;

    client_max_body_size 25m;

    access_log /var/log/nginx/pos.panatradeprestasi.net.access.log;
    error_log  /var/log/nginx/pos.panatradeprestasi.net.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $pos_forwarded_proto;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pos_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
